name: LegendaryAI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  browser-smoke:
    name: Playwright browser smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
      - name: Install pinned Playwright
        run: npm install --no-save --package-lock=false playwright@1.64.1
      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Test app shell, deep links and legal pages in a browser
        run: node tests/e2e-smoke.mjs


  postgres-integration:
    name: PostgreSQL schema, RLS, payment and quota tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: legendaryai_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d legendaryai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: legendaryai_test
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Check schema dollar-quoting and privileged RPC contracts
        run: node tests/postgres-contract.test.mjs
      - name: Create disposable Supabase auth/storage fixture
        run: psql -v ON_ERROR_STOP=1 -f tests/postgres/bootstrap.sql
      - name: Execute repository schema on clean PostgreSQL 17
        run: psql -v ON_ERROR_STOP=1 -f supabase/schema.sql
      - name: Apply the latest hardening migration on PostgreSQL 17
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261020120000_legal_payment_retention_hardening.sql
      - name: Exercise RLS, refund idempotency, and MoMo finalization
        run: psql -v ON_ERROR_STOP=1 -f tests/postgres/integration.sql
      - name: Race two token reservations against one budget
        run: bash tests/postgres/token-concurrency.sh

  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2.0.5
        with:
          deno-version: 2.9.6
      - name: CORS origin allowlist regression
        run: node tests/cors-origin-policy.test.mjs
      - name: Security hardening regression
        run: node tests/security-hardening.test.mjs
      - name: Chat rendering security and attachment bounds
        run: node tests/chat-security.test.mjs
      - name: Cloud sync conflict/race regression
        run: node tests/cloud-sync-runtime.test.mjs
      - name: Cloud sync conflict and offline recovery integration
        run: node tests/cloud-sync-integration.test.mjs
      - name: Legal routes and consent regression
        run: node tests/legal-routes.test.mjs
      - name: Auth privacy and OAuth failure contract
        run: node tests/auth-privacy-contract.test.mjs
      - name: Chat auth/cache isolation contract
        run: node tests/chat-auth-cache-contract.test.mjs
      - name: Current-tree secret scan
        run: node tests/secret-scan.test.mjs
      - name: Git history secret scan
        run: node scripts/secret-scan.mjs --history
      - name: Browser routing regression
        run: node tests/chat-routing.test.js
      - name: Image intent regression
        run: node tests/image-intent.test.js
      - name: Cognitive core v2 regressions
        run: node tests/cognitive-core-v2.test.mjs
      - name: Native core regressions
        run: deno test --allow-read tests/brain-native-core.test.mjs tests/plan-capabilities.test.mjs
      - name: Model runtime contract
        run: deno test tests/model-runtime-contract.test.mjs
      - name: Chat quota/cache and memory side-effect contract
        run: node tests/chat-quota-contract.test.mjs
      - name: MoMo HMAC/signature canonicalization test vectors
        run: deno test tests/momo-signature.test.mjs
      - name: WebGL reduced-motion and cleanup regression
        run: node tests/bg3d-runtime.test.mjs
      - name: Type-check ai-chat-v10
        run: deno check supabase/functions/ai-chat-v10/index.ts
      - name: Type-check local model health function
        run: deno check supabase/functions/local-model-health/index.ts
      - name: Type-check legacy ai-chat
        run: deno check supabase/functions/ai-chat/index.ts
      - name: Type-check retired ai-chat-v9 route
        run: deno check supabase/functions/ai-chat-v9/index.ts
      - name: Type-check MoMo create and IPN
        run: deno check supabase/functions/momo-create-payment/index.ts supabase/functions/momo-ipn/index.ts
      - name: Type-check account and support functions
        run: deno check supabase/functions/account-data/index.ts supabase/functions/support-request/index.ts
      - name: Type-check retention cleanup
        run: deno check supabase/functions/data-retention-cleanup/index.ts
      - name: Type-check Owner and token reset functions
        run: deno check supabase/functions/owner-admin/index.ts supabase/functions/owner-stats/index.ts supabase/functions/token-reset/index.ts
      - name: Type-check disabled image generation endpoint
        run: deno check supabase/functions/image-generate/index.ts
