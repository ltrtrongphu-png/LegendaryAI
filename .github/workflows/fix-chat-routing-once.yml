name: Fix chat routing once
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message != 'fix: repair chat image intent routing'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair escaped word boundaries
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('js/chat.js')
          s = p.read_text()
          old = r'\\b'
          new = r'\b'
          if old not in s:
              raise SystemExit('Expected broken image-routing escape was not found')
          s = s.replace(old, new)
          p.write_text(s)
          PY
      - name: Run routing regression
        run: node tests/chat-routing.test.js
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/chat.js
          git commit -m 'fix: repair chat image intent routing'
          git push
