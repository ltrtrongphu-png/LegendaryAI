name: One-time image intent repair

on:
  push:
    branches: [feat/legendaryai-reliability-exec]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ github.event.head_commit.message != 'fix: harden image intent classifier' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch classifier and remove one-time workflow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('js/chat.js')
          s = p.read_text()
          pattern = re.compile(r"  function isImageGenerationPrompt\(text\) \{.*?\n  \}\n\n  function callImageProvider", re.S)
          replacement = '''  function isImageGenerationPrompt(text) {
    var x = String(text || '').trim();
    if (!x) return false;

    // Keep diagrams, charts, code and planning language on the text-model path.
    if (/(?:sơ đồ|diagram|mermaid|flowchart|biểu đồ|chart|graph|code|mã|architecture|kiến trúc)/i.test(x)) return false;
    if (/(?:kế hoạch|plan|roadmap|lộ trình|hình thành|thói quen|smart contract|solidity|javascript|typescript|python)/i.test(x) &&
        !/(?:ảnh|image|picture|illustration|wallpaper|avatar|logo|poster|thumbnail|photo|meme)/i.test(x)) return false;

    if (/(?:^|\\s)(?:vẽ|draw)(?:\\s|$)/i.test(x)) return true;

    return /(?:^|\\s)(?:tạo|generate|create)(?:\\s|$)/i.test(x) &&
      /(?:^|\\s)(?:ảnh|image|picture|illustration|art|wallpaper|avatar|logo|poster|thumbnail|photo|meme)(?:\\s|$)/i.test(x);
  }

  function callImageProvider'''
          if not pattern.search(s):
              raise SystemExit('classifier pattern not found')
          p.write_text(pattern.sub(replacement, s, count=1))
          PY
          git rm .github/workflows/patch-image-intent.yml
          git config user.name 'LegendaryAI Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add js/chat.js
          git commit -m 'fix: harden image intent classifier'
          git push origin HEAD:feat/legendaryai-reliability-exec
