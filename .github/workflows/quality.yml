name: LegendaryAI quality
on:
  pull_request:
  push:
    branches: [main]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: node --check js/account.js && node --check js/ai-engine.js && node --check js/chat.js && node --check js/cloud-sync.js && node --check js/main.js && node --check js/ui-upgrade.js && node --check js/power-suite.js
      - name: Verify required frontend hooks
        run: node -e "const fs=require('fs');const h=fs.readFileSync('index.html','utf8');for(const x of ['/js/chat.js','/js/ai-engine.js','/js/power-suite.js','/css/power-suite.css'])if(!h.includes(x))throw new Error('Missing '+x);console.log('frontend hooks: PASS')"
      - name: Regression test chat routing
        run: node tests/chat-routing.test.js
      - name: Regression test image intent
        run: node tests/image-intent.test.js
      - name: Regression test Legendary Brain native core
        run: node tests/brain-native-core.test.mjs
