name: LegendaryAI quality\non:\n  pull_request:\n  push:\n    branches: [main]\njobs:\n  syntax:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-node@v4\n        with:\n          node-version: 20\n      - name: Check JavaScript syntax\n        run: node --check js/account.js && node --check js/ai-engine.js && node --check js/chat.js && node --check js/cloud-sync.js && node --check js/main.js && node --check js/ui-upgrade.js && node --check js/power-suite.js\n      - name: Verify required frontend hooks\n        run: node -e "const fs=require('fs');const h=fs.readFileSync('index.html','utf8');for(const x of ['/js/chat.js','/js/ai-engine.js','/js/power-suite.js','/css/power-suite.css'])if(!h.includes(x))throw new Error('Missing '+x);console.log('frontend hooks: PASS')"