name: LegendaryAI quality

'on':
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  syntax:
    name: Frontend syntax and regression
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check js/account.js
          node --check js/ai-engine.js
          node --check js/chat.js
          node --check js/cloud-sync.js
          node --check js/main.js
          node --check js/bg3d.js
          node --check js/ui-upgrade.js
          node --check js/power-suite.js
          node --check legal/contact.js
          node --check legal/payment-result.js
      - name: Verify required frontend hooks
        run: |
          node --input-type=commonjs -e 'const fs=require("node:fs");const h=fs.readFileSync("index.html","utf8");for(const x of ["/js/chat.js","/js/ai-engine.js","/js/power-suite.js","/css/power-suite.css"])if(!h.includes(x))throw new Error("Missing frontend hook: "+x);console.log("frontend hooks: PASS")'
      - name: Regression test chat routing
        run: node tests/chat-routing.test.js
      - name: Regression test image intent
        run: node tests/image-intent.test.js
      - name: Regression test Legendary Brain native core
        run: node tests/brain-native-core.test.mjs
      - name: Regression test background rendering lifecycle
        run: node tests/bg3d-runtime.test.mjs
