<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
<title>Legendary AI logo</title><desc>Blue-violet neural orbit surrounding a luminous AI core.</desc>
<defs>
